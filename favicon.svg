<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Soft radial glow inside the circle -->
    <radialGradient id="circleGlow" cx="50%" cy="44%" r="56%">
      <stop offset="0%" stop-color="#EBF4FB"/>
      <stop offset="65%" stop-color="#D3E8F8"/>
      <stop offset="100%" stop-color="#C5DDF2"/>
    </radialGradient>

    <!-- Faint soft shadow underneath the circle -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8BB5D6" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Square canvas with very pale ice-blue background and softly rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="#EAF3FC"/>

  <!-- Large centered circle in light sky blue with soft radial glow and shadow -->
  <circle cx="256" cy="256" r="162" fill="url(#circleGlow)" filter="url(#softShadow)"/>

  <!-- Banknotes peeking out of the top of the wallet -->
  <g>
    <!-- Left / Back Banknote (tilted outline) -->
    <rect x="165" y="182" width="98" height="54" rx="8" transform="rotate(-36 214 209)"
          fill="#D3E8F8" stroke="#2B9CE0" stroke-width="11" stroke-linejoin="round"/>

    <!-- Right / Front Banknote (tilted outline with circle in the middle) -->
    <rect x="198" y="160" width="98" height="54" rx="8" transform="rotate(-36 247 187)"
          fill="#D3E8F8" stroke="#2B9CE0" stroke-width="11" stroke-linejoin="round"/>
    <circle cx="247" cy="187" r="11" fill="#2B9CE0"/>
  </g>

  <!-- Solid-blue wallet body (rounded-rectangle) -->
  <rect x="170" y="238" width="164" height="142" rx="26" ry="26" fill="#2B9CE0"/>

  <!-- Thin light-blue gap / top wallet opening -->
  <path d="M 184 256 Q 212 258 248 256" stroke="#D3E8F8" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Clasp tab on the right side separated by thin light-blue gap -->
  <path d="M 334 293 H 290 A 24 24 0 0 0 290 341 H 334" fill="#2B9CE0" stroke="#D3E8F8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Small light-blue button circle on the tab -->
  <circle cx="298" cy="317" r="8.5" fill="#D3E8F8"/>
</svg>
